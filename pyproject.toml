[project]
name = "jk-step-mr-flowdpo"
version = "0.1.0"
description = "ACE-Step supervised and MR-FlowDPO LoRA trainer with automatic music-folder datasets, CLI and browser UI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "CC-BY-NC-SA-4.0"}
dependencies = [
  "torch==2.10.0", "torchaudio==2.10.0", "torchvision==0.25.0",
  "transformers>=4.51,<4.58", "peft>=0.18,<0.20", "accelerate>=1.12,<2",
  "safetensors>=0.6", "einops>=0.8.1", "vector-quantize-pytorch>=1.27.15",
  "diffusers>=0.32", "lightning>=2.3.3", "soundfile>=0.13.1",
  "pyloudnorm>=0.1", "numpy>=1.26,<2", "scipy>=1.12,<1.16", "librosa>=0.10,<0.12", "torchcodec>=0.10,<0.11",
  "qwen-omni-utils>=0.0.6", "imageio-ffmpeg>=0.6",
  "loguru>=0.7.3", "tensorboard>=2.20", "rich>=13",
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "mutagen>=1.47",
  "nvidia-ml-py>=12", "huggingface-hub>=0.34,<1", "hf-xet>=1.1",
  "lycoris-lora>=2", "prodigyopt>=1.1.2",
  "bitsandbytes>=0.45; platform_system != 'Darwin'",
]
[project.scripts]
jk-step = "jk_step.cli:main"
jk-toolkit = "train:main"
sidestep = "train:main"
[project.optional-dependencies]
full = ["lyricsgenius>=3.0.1", "google-genai>=1", "openai>=1.54", "demucs>=4", "textual>=0.47"]
rewards = ["laion-clap==1.1.7", "audiobox-aesthetics==0.0.4"]
native = ["pywebview>=5"]
dev = ["pytest>=9", "httpx>=0.28"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.hatch.build.targets.wheel]
packages = ["jk_step", "jk_engine"]
[tool.hatch.build.targets.wheel.force-include]
"train.py" = "train.py"
"frontend" = "frontend"
"assets" = "assets"
[tool.hatch.build.targets.sdist]
include = ["jk_step", "jk_engine", "frontend", "assets", "scripts", "tests", "configs", "docs", "*.py", "*.toml", "*.txt", "*.md", "*.bat", "*.ps1", "*.sh", "LICENSE"]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = [{index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'"}]
torchaudio = [{index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'"}]
torchvision = [{index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'"}]
